<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b0f">
<title>KANUNSUZ: İstanbul 1994</title>
<style>
:root{
 --bg:#080a0d;--panel:#10141a;--panel2:#161c24;--line:#2b323d;--text:#f0f2f4;
 --muted:#9ca6b3;--gold:#d1a54e;--gold2:#8d6a29;--red:#c34545;--green:#5ea779;
 --blue:#6d98c2;--shadow:0 18px 55px rgba(0,0,0,.5);--radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#07090c;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#app{min-height:100vh}
.screen{min-height:100vh}
.cine-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.035);animation:kenburns 18s ease-in-out infinite alternate}
@keyframes kenburns{0%{transform:scale(1.035) translate3d(0,0,0)}100%{transform:scale(1.09) translate3d(-1.5%,.8%,0)}}
.overlay{position:absolute;inset:0;background:
 radial-gradient(circle at 75% 30%,rgba(201,153,65,.12),transparent 35%),
 linear-gradient(90deg,rgba(3,5,8,.93) 0%,rgba(3,5,8,.7) 38%,rgba(3,5,8,.25) 70%,rgba(3,5,8,.72) 100%),
 linear-gradient(180deg,rgba(4,6,9,.15),rgba(4,6,9,.92))}
.rain-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:.4}
.rain-layer i{position:absolute;top:-15vh;width:1px;height:13vh;background:linear-gradient(transparent,rgba(255,255,255,.38));animation:rain linear infinite}
@keyframes rain{to{transform:translate3d(-28px,125vh,0)}}
.noise{position:absolute;inset:0;pointer-events:none;opacity:.05;background-image:repeating-radial-gradient(circle at 0 0,transparent 0,#fff 1px,transparent 2px);background-size:5px 5px;mix-blend-mode:overlay}
.logo{font-family:Georgia,serif;font-weight:900;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 4px 30px #000}
.logo .sub{display:block;font-family:Inter,sans-serif;font-size:.24em;letter-spacing:.35em;color:#d65b4c;margin-top:.25em}
.splash{position:relative;display:grid;place-items:center;overflow:hidden;padding:28px}
.splash-inner{position:relative;z-index:2;width:min(1050px,100%);display:grid;grid-template-columns:minmax(0,620px) 1fr;gap:34px;align-items:center}
.splash-copy{padding:34px 0}
.splash h1{font-size:clamp(45px,8vw,90px);margin:0 0 18px}
.splash p{max-width:590px;color:#d5dae0;line-height:1.65;font-size:16px}
.splash-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{border:1px solid #3a424d;background:#202731;color:#fff;border-radius:12px;padding:11px 15px;font-weight:800;letter-spacing:.02em;box-shadow:0 8px 18px rgba(0,0,0,.16)}
.btn:hover{filter:brightness(1.09)}
.btn.gold{background:linear-gradient(180deg,#ddb85f,#aa7c2d);border-color:#e3c477;color:#151009}
.btn.red{background:linear-gradient(180deg,#8d3030,#5b2020);border-color:#a74242}
.btn.ghost{background:rgba(9,12,16,.45);backdrop-filter:blur(8px)}
.btn.full{width:100%}
.intro-panel{border:1px solid rgba(209,165,78,.35);background:rgba(7,9,12,.63);backdrop-filter:blur(13px);border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.intro-panel h3{font-family:Georgia,serif;margin:0 0 10px;font-size:24px}
.intro-panel .line{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:16px 0}
.kicker{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.small{font-size:12px;color:var(--muted)}
.character-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.char-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0b0f14;position:relative}
.char-card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;filter:saturate(.9)}
.char-card.sel{outline:2px solid var(--gold)}
.char-card b{display:block;padding:10px;text-align:center}
.input{width:100%;padding:12px 13px;border-radius:12px;border:1px solid #353d49;background:#0a0e13;color:#fff;margin:10px 0}
.story-box{font-family:Georgia,serif;font-size:18px;line-height:1.65;color:#e5e0d5}
.story-choice{display:grid;gap:8px;margin-top:18px}

.game{min-height:100vh;background:
 radial-gradient(circle at 70% 0%,rgba(71,94,123,.13),transparent 34%),
 linear-gradient(180deg,#090c11,#07090c 55%,#050608)}
.shell{max-width:1320px;margin:auto;padding:12px 12px 84px}
.topbar{position:sticky;top:0;z-index:30;border:1px solid rgba(255,255,255,.06);background:rgba(8,10,13,.9);backdrop-filter:blur(14px);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mini-logo{font-family:Georgia,serif;letter-spacing:.12em;font-weight:900}.mini-logo span{color:#d55b4f}
.stats{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:#0b0f14;border:1px solid #2c333e;border-radius:999px;padding:7px 10px;font-size:12px;white-space:nowrap}
.stat b{color:#fff}
.main-grid{display:grid;grid-template-columns:238px minmax(0,1fr);gap:12px;margin-top:12px}
.side{position:sticky;top:84px;height:max-content;background:linear-gradient(180deg,#11161d,#0b0f14);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:8px;box-shadow:var(--shadow)}
.nav{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#cbd2da;padding:11px 12px;border-radius:11px;text-align:left}
.nav:hover,.nav.active{background:linear-gradient(90deg,rgba(209,165,78,.18),rgba(255,255,255,.03));color:#fff}
.nav .ico{width:23px;text-align:center}
.content{min-width:0}
.card{background:linear-gradient(180deg,rgba(18,23,30,.98),rgba(11,15,20,.98));border:1px solid rgba(255,255,255,.075);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.pad{padding:18px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.section-head h2{font-family:Georgia,serif;font-size:24px;margin:0}
.badge{font-size:11px;padding:6px 9px;border:1px solid #343c47;background:#090d12;border-radius:999px;color:#cdd4dc}
.hero-card{position:relative;min-height:420px;display:flex;align-items:flex-end;overflow:hidden}
.hero-card .image{position:absolute;inset:0;background-size:cover;background-position:center;animation:kenburns 20s ease-in-out infinite alternate}
.hero-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,10,.05),rgba(4,7,10,.88) 80%),linear-gradient(90deg,rgba(5,8,11,.28),transparent 65%)}
.hero-content{position:relative;z-index:2;padding:28px;max-width:720px}
.hero-content h2{font-family:Georgia,serif;font-size:38px;margin:5px 0 10px}
.hero-content p{color:#d0d6de;line-height:1.55;margin:0}
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick{border:1px solid #2c3440;border-radius:14px;background:#0d1218;padding:14px}
.quick b{display:block;font-size:18px;margin-bottom:5px}.quick small{color:var(--muted)}
.meter{height:8px;background:#070a0e;border-radius:999px;overflow:hidden;border:1px solid #252c35}.meter i{display:block;height:100%;background:linear-gradient(90deg,#8a672a,#d9ae55)}
.meter.red i{background:linear-gradient(90deg,#6b2424,#cf4d4d)}
.meter.green i{background:linear-gradient(90deg,#2e694a,#65b181)}
.image-card{position:relative;border:1px solid #303844;border-radius:16px;overflow:hidden;background:#0a0e13}
.image-card .pic{height:210px;background-size:cover;background-position:center;position:relative;overflow:hidden}
.image-card .pic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(4,7,10,.82))}
.image-card:hover .pic{animation:microzoom 7s ease-in-out infinite alternate}
@keyframes microzoom{to{background-size:110% auto}}
.image-card .body{padding:14px}
.image-card h3{margin:0 0 5px;font-size:17px}.image-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.42}
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.job-card .pic{height:230px}
.job-meta{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.chip{font-size:11px;padding:5px 7px;border:1px solid #313946;background:#090d12;border-radius:999px;color:#cbd2db}
.risk{color:#f18e8e}
.money{color:#f1c667;font-weight:900}
.city-card .pic{height:180px}.city-card.locked .pic{filter:grayscale(.6) brightness(.6)}.city-card.locked{opacity:.78}
.city-name{position:absolute;left:12px;bottom:10px;z-index:3;font-family:Georgia,serif;font-size:20px;font-weight:800;text-shadow:0 2px 12px #000}
.city-lock{position:absolute;right:10px;top:10px;z-index:3;background:rgba(0,0,0,.65);border:1px solid #4a5260;border-radius:999px;padding:5px 8px}
.family-row,.list-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid #2c3440;border-radius:13px;background:#0b1016}
.family-row h4,.list-row h4{margin:0 0 4px}.family-row p,.list-row p{margin:0;color:var(--muted);font-size:12px}
.list{display:grid;gap:9px}
.social-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.social-photo{min-height:390px;background-size:cover;background-position:center;position:relative}
.social-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.88))}
.social-copy{position:absolute;left:18px;right:18px;bottom:18px;z-index:2}
.social-copy h2{font-family:Georgia,serif;margin:0 0 8px;font-size:30px}
.candidates{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.candidate{border:1px solid #303844;border-radius:12px;padding:10px;background:#0b0f14;display:flex;align-items:center;gap:10px}
.candidate img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:1px solid #4b5562}
.property-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.property{border:1px solid #2d3540;border-radius:13px;background:#0b0f14;overflow:hidden}
.property .pimg{height:120px;background-size:cover;background-position:center}.property .pbody{padding:11px}
.news-paper{background:#d9cfb2;color:#16130f;border-radius:10px;padding:20px;font-family:Georgia,serif;box-shadow:inset 0 0 45px rgba(83,65,34,.24)}
.news-paper h2{font-size:32px;text-align:center;border-top:4px double #1f1a13;border-bottom:4px double #1f1a13;padding:8px 0;margin:0 0 18px}
.news-item{border-bottom:1px solid rgba(30,24,16,.4);padding:10px 0}.news-item h3{margin:0 0 4px;font-size:19px}.news-item p{margin:0;line-height:1.45}
.log{max-height:260px;overflow:auto}.logline{border-bottom:1px dashed #2b323c;padding:9px 0;font-size:12px;color:#c9d0d8}.logline time{color:#687483;margin-right:8px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:18px;backdrop-filter:blur(7px)}
.modal-box{width:min(720px,100%);border-radius:20px;overflow:hidden;background:#0f141a;border:1px solid #39424e;box-shadow:0 28px 90px rgba(0,0,0,.65)}
.modal-visual{height:300px;background-size:cover;background-position:center;position:relative;animation:kenburns 14s ease-in-out infinite alternate}
.modal-visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.86))}
.modal-content{padding:20px}.modal-content h2{font-family:Georgia,serif;font-size:30px;margin:0 0 8px}
.modal.success .modal-box{border-color:rgba(94,167,121,.7)}.modal.police .modal-box{border-color:rgba(195,69,69,.8)}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.countdown{font:800 42px/1 Georgia,serif;color:var(--gold);margin:10px 0}
.bottom-nav{display:none}
@media(max-width:1000px){
 .cards4{grid-template-columns:repeat(2,1fr)}.cards3{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
 .splash-inner{grid-template-columns:1fr}.intro-panel{max-width:520px}.main-grid{grid-template-columns:1fr}.side{display:none}
 .shell{padding:8px 8px 82px}.topbar{border-radius:13px}.toprow{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}
 .bottom-nav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:8px;right:8px;bottom:8px;z-index:60;background:rgba(8,10,13,.94);backdrop-filter:blur(14px);border:1px solid #2d3540;border-radius:16px;padding:6px;box-shadow:var(--shadow)}
 .bottom-nav button{border:0;background:transparent;color:#aeb7c2;border-radius:11px;padding:8px 3px;font-size:10px}.bottom-nav button b{display:block;font-size:18px}.bottom-nav button.active{background:rgba(209,165,78,.16);color:#fff}
 .hero-card{min-height:370px}.hero-content{padding:20px}.hero-content h2{font-size:31px}.quick-grid{grid-template-columns:repeat(2,1fr)}
 .social-hero{grid-template-columns:1fr}.social-photo{min-height:330px}
}
@media(max-width:560px){
 .cards2,.cards3,.cards4{grid-template-columns:1fr}.job-card .pic{height:205px}.city-card .pic{height:190px}
 .splash{padding:18px}.splash-copy{padding:10px 0}.splash p{font-size:14px}.character-grid{grid-template-columns:1fr 1fr}
 .quick-grid{grid-template-columns:1fr 1fr}.stats{gap:5px}.stat{padding:6px 8px;font-size:11px}.mini-logo{font-size:13px}
 .modal-visual{height:220px}.property-grid{grid-template-columns:1fr}
}

/* V11.2 cinematic intro + rules */
.cinema-screen{position:relative;min-height:100vh;overflow:hidden;background:#020304;color:#fff;display:flex;align-items:flex-end}
.cinema-bg{position:absolute;inset:-3%;background-size:cover;background-position:center;filter:saturate(.86) contrast(1.08);animation:cinemaPush 9s ease-out both}
.cinema-vignette{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.16) 45%,rgba(0,0,0,.94) 100%),radial-gradient(circle at 50% 35%,transparent 20%,rgba(0,0,0,.42) 100%)}
.cinema-copy{position:relative;z-index:5;width:min(920px,calc(100% - 34px));margin:0 auto 42px;padding:22px 22px 18px;border-left:2px solid rgba(209,165,78,.82);background:linear-gradient(90deg,rgba(4,5,7,.76),rgba(4,5,7,.22),transparent);text-shadow:0 2px 18px #000}
.cinema-copy h1{font:800 clamp(42px,8vw,92px)/.9 Georgia,serif;letter-spacing:.06em;margin:6px 0 12px}
.cinema-copy h2{font:700 clamp(27px,5vw,54px)/1 Georgia,serif;margin:5px 0 12px}
.cinema-copy p{font-size:clamp(16px,2.3vw,21px);max-width:760px;line-height:1.55;margin:7px 0;color:#e7e7e7}
.cinema-quote{font:italic 600 clamp(19px,2.8vw,28px)/1.45 Georgia,serif;color:#fff}
.cinema-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:17px}
.cinema-dots{display:flex;gap:7px;margin-right:auto}.cinema-dot{width:24px;height:3px;border-radius:4px;background:#555}.cinema-dot.on{background:var(--gold)}
.cinema-skip{position:absolute;z-index:8;right:18px;top:18px;background:rgba(0,0,0,.52);color:#ddd;border:1px solid #555;border-radius:999px;padding:9px 13px;font:inherit}
@keyframes cinemaPush{from{transform:scale(1.03)}to{transform:scale(1.10)}}
.rule-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.rule-card{border:1px solid #282c32;background:linear-gradient(145deg,#101319,#090b0f);border-radius:17px;padding:16px}
.rule-card h3{margin:0 0 7px;font-size:17px}.rule-card p{margin:0;color:#aeb4be;line-height:1.5;font-size:13px}
.rule-num{font:800 22px/1 Georgia,serif;color:var(--gold);margin-bottom:8px}
.rules-warning{border:1px solid rgba(209,165,78,.38);background:rgba(209,165,78,.07);border-radius:16px;padding:15px;margin:12px 0}
@media(max-width:680px){.cinema-copy{margin-bottom:26px}.rule-grid{grid-template-columns:1fr}}


/* V11.3 auto cinematic */
.cinema-screen{isolation:isolate}
.cinema-screen:before,.cinema-screen:after{content:"";position:absolute;left:0;right:0;height:5vh;background:#000;z-index:7;pointer-events:none}
.cinema-screen:before{top:0}.cinema-screen:after{bottom:0}
.cinema-screen.scene-0 .cinema-bg{animation:cinemaPan0 8.2s ease-out both}
.cinema-screen.scene-1 .cinema-bg{animation:cinemaPan1 8.2s ease-out both}
.cinema-screen.scene-2 .cinema-bg{animation:cinemaPan2 8.2s ease-out both}
.cinema-screen.scene-3 .cinema-bg{animation:cinemaPan3 8.2s ease-out both}
.cinema-screen.title-scene .cinema-bg{animation:cinemaTitle 6s ease-out both}
@keyframes cinemaPan0{from{transform:scale(1.04) translate3d(-1.5%,0,0)}to{transform:scale(1.12) translate3d(1.5%,-1%,0)}}
@keyframes cinemaPan1{from{transform:scale(1.10) translate3d(2%,1%,0)}to{transform:scale(1.04) translate3d(-1.5%,-1%,0)}}
@keyframes cinemaPan2{from{transform:scale(1.05) translate3d(-2%,0,0)}to{transform:scale(1.13) translate3d(1%,1%,0)}}
@keyframes cinemaPan3{from{transform:scale(1.12) translate3d(1.5%,1%,0)}to{transform:scale(1.05) translate3d(-1%,-1%,0)}}
@keyframes cinemaTitle{from{transform:scale(1.13);filter:saturate(.65) brightness(.74)}to{transform:scale(1.04);filter:saturate(.9) brightness(.88)}}
.cinema-fog{position:absolute;inset:-20% -35%;z-index:2;pointer-events:none;opacity:.30;background:
 radial-gradient(ellipse at 25% 45%,rgba(220,225,230,.22),transparent 25%),
 radial-gradient(ellipse at 70% 35%,rgba(205,215,225,.16),transparent 30%),
 radial-gradient(ellipse at 50% 72%,rgba(210,220,226,.12),transparent 28%);
 filter:blur(28px);animation:fogDrift 13s linear infinite alternate}
@keyframes fogDrift{from{transform:translate3d(-5%,0,0) scale(1.02)}to{transform:translate3d(7%,-2%,0) scale(1.08)}}
.cinema-light{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen;background:
 radial-gradient(circle at 72% 24%,rgba(255,202,92,.11),transparent 12%),
 radial-gradient(circle at 19% 58%,rgba(255,229,180,.055),transparent 16%);
 animation:streetFlicker 5.2s steps(1,end) infinite}
@keyframes streetFlicker{0%,17%,21%,62%,67%,100%{opacity:.9}18%,20%,64%{opacity:.48}}
.cinema-copy{animation:copyRise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes copyRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.cinema-quote{animation:quoteGlow 3.8s ease-in-out infinite alternate}
@keyframes quoteGlow{from{text-shadow:0 2px 18px #000}to{text-shadow:0 2px 18px #000,0 0 18px rgba(214,171,82,.19)}}
.cinema-progress{height:2px;background:#333;overflow:hidden;border-radius:3px;flex:1;min-width:90px}
.cinema-progress i{display:block;height:100%;width:0;background:var(--gold);animation:sceneProgress var(--sceneMs,7600ms) linear forwards}
@keyframes sceneProgress{to{width:100%}}
.music-toggle{position:absolute;z-index:9;left:18px;top:18px;background:rgba(0,0,0,.56);color:#eee;border:1px solid #555;border-radius:999px;padding:9px 13px;font:inherit;backdrop-filter:blur(6px)}
.cinema-title-logo{font:900 clamp(52px,11vw,116px)/.86 Georgia,serif;letter-spacing:.08em;margin:5px 0;animation:titleReveal 1.8s ease both}
@keyframes titleReveal{from{opacity:0;letter-spacing:.18em;filter:blur(8px);transform:scale(.94)}to{opacity:1;letter-spacing:.08em;filter:blur(0);transform:scale(1)}}
.rule-long-intro{font-size:15px;line-height:1.65;color:#c6cbd2;max-width:1000px}
.rule-section{margin-top:12px;border:1px solid #292d34;background:linear-gradient(145deg,#101319,#080a0d);border-radius:18px;padding:18px}
.rule-section h3{font-size:19px;margin:0 0 8px;color:#f1f1f1}
.rule-section h4{font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--gold);margin:15px 0 7px}
.rule-section p{color:#b7bdc6;line-height:1.65;margin:7px 0}
.rule-section ul{margin:8px 0 0 20px;color:#b7bdc6;line-height:1.65}
.rule-section li{margin:5px 0}
.rule-toc{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.rule-toc span{border:1px solid #333842;background:#0c0f13;border-radius:999px;padding:7px 10px;font-size:12px;color:#c8cdd4}


/* =========================
   V12 ONLINE BETA
   ========================= */
.online-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#34d058;box-shadow:0 0 12px rgba(52,208,88,.7);margin-right:6px}
.online-dot.off{background:#777;box-shadow:none}
.online-auth{min-height:100vh;background:#040506;color:#fff;position:relative;display:grid;place-items:center;overflow:hidden;padding:28px 14px}

.cinema-screen .cinema-bg{background-size:cover;background-repeat:no-repeat}

}
